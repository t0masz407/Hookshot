permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check extraction boundaries
        run: python -I -B nx2/test_nup_paths.py
      - name: Check source-cache coherency
        run: python -I -B tests/test_make_game_cache.py
      - name: Check Vulkan presentation rectangle
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Visual Studio locator not found.
            exit /b 1
          )
          set "VSROOT="
          for /f "usebackq delims=" %%i in (`call "%VSWHERE%" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo Visual Studio 2022 C++ tools not found.
            exit /b 1
          )
          if not exist "%VSROOT%\Common7\Tools\VsDevCmd.bat" (
            echo Visual Studio developer command prompt not found.
            exit /b 1
          )
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fo"%TEMP%\present_rect_test.obj" /Fe:"%TEMP%\present_rect_test.exe" gpu\vk\tests\present_rect_test.cpp
          if errorlevel 1 exit /b 1
          "%TEMP%\present_rect_test.exe"
          if errorlevel 1 exit /b 1
      - name: Check the Windows link's oldnames default
        run: python -I -B tests/test_msvc_oldnames.py
      - name: Check isolated child Unicode output
        run: python -I -B tests/test_child_unicode.py
      - name: Check packaged CPM discovery
        run: python -I -B tests/test_cpm_discovery.py
      - name: Check safe installation of built files
        run: python -I -B tests/test_finish_output.py
      - name: Check a failed step's error line
        run: python -I -B tests/test_failure_reason.py
      - name: Linux builder worker selection
        run: python -I -B tests/test_linux_builder_jobs.py
      - name: Set up .NET for Windows Builder checks
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Windows Builder worker delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet restore tests/builder_workers/BuilderWorkersTests.csproj --configfile tests/builder_workers/NuGet.Config
          dotnet run --project tests/builder_workers/BuilderWorkersTests.csproj --configuration Release --no-restore -- (Get-Command python).Source
      - name: Compile Windows Builder
        if: runner.os == 'Windows'
        run: dotnet build builder/HookshotBuilder/HookshotBuilder.csproj --configuration Debug -p:NuGetAudit=false
      - name: C++ compiler for the import-hold check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Check failed-import backoff
        if: runner.os == 'Linux'
        run: python -I -B tests/test_import_hold.py
      - name: Check the FPS counter's first sample
        if: runner.os == 'Linux'
        run: python -I -B tests/test_fps_rate.py
      - name: Check a vertex stream is bound once
        if: runner.os == 'Linux'
        run: python -I -B tests/test_vertex_bind.py
      - name: Check FPS overlay transfer ordering
        if: runner.os == 'Linux'
        run: python -I -B tests/test_fps_overlay_order.py
      - name: Check dispatch timing stays off
        run: python -I -B tests/test_dispatch_clock.py
      - name: Check frame generation stays off until asked
        if: runner.os == 'Linux'
        run: python -I -B tests/test_framegen_gate.py
      - name: Check upscaling works without frame generation
        if: runner.os == 'Linux'
        run: python -I -B tests/test_upscale_independent.py
      - name: Check the table-entry tracker stops looking
        if: runner.os == 'Linux'
        run: python -I -B tests/test_table_track.py
      - name: Check descriptor timing stays off
        run: python -I -B tests/test_desc_clock.py
      - name: Check the work folder's copies stay writable
        run: python -I -B tests/test_copy_writable.py
      - name: Check the swapchain takes an sRGB surface format
        run: python -I -B tests/test_swapchain_colorspace.py
      - name: Check a mesh program's stage buffer starts at zero
        run: python -I -B tests/test_mesh_stage_buffer_zero.py
      - name: Check a mesh program with control topology 1 draws points
        run: python -I -B tests/test_mesh_point_topology.py
      - name: Check the replay clock skips the performance counter
        if: runner.os == 'Linux'
        run: python -I -B tests/test_prof_clock.py
      - name: Check a pool span is reused without the lock
        if: runner.os == 'Linux'
        run: python -I -B tests/test_pool_span.py
      - name: Check a captured page is read once
        if: runner.os == 'Linux'
        run: python -I -B tests/test_submitted_page.py
      - name: Check uniform words skip a known gap
        if: runner.os == 'Linux'
        run: python -I -B tests/test_ub_gap.py
      - name: Check a repeated uniform word is not read again
        if: runner.os == 'Linux'
        run: python -I -B tests/test_ub_memo.py
      - name: Check a pass hazard skips textures that are not targets
        if: runner.os == 'Linux'
        run: python -I -B tests/test_pass_hazard.py
      - name: Check a repeated read bind is not looked up again
        if: runner.os == 'Linux'
        run: python -I -B tests/test_bind_memo.py
      - name: Check the shader list's text encoding
        run: python -I -B tests/test_shader_census_cmd.py
      - name: Check the shader list has the game's compute programs
        run: python -I -B tests/test_shader_census.py
      - name: Check shader preparation saves the pipeline cache
        if: runner.os == 'Linux'
        run: python -I -B tests/test_prepare_cache_save.py
      - name: Check multi-second frames remain in the requested slow log
        if: runner.os == 'Linux'
        run: python -I -B tests/test_slow_frame_limit.py
      - name: Check sampled 2D views of 3D images have the creation flag
        if: runner.os == 'Linux'
        run: python -I -B tests/test_3d_view_create_flags.py
      - name: Check the optional native present-return trace
        if: runner.os == 'Linux'
        run: python -I -B tests/test_present_trace.py
      - name: Check the build's version stamp
        run: python -I -B nx2/test_version.py
      - name: Check the release changelog entry
        run: python -I -B tests/test_changelog.py
      - name: Check a repeated draw keeps its program and pipeline
        if: runner.os == 'Linux'
        run: python -I -B tests/test_same_draw.py
      - name: Check the audio mixer's catch-up
        if: runner.os == 'Linux'
        run: python -I -B tests/test_audio_deadline.py
      - name: Check audio output recovers from failed device calls
        if: runner.os == 'Linux'
        run: python -I -B tests/test_audio_output_errors.py
      - name: Check a null NVN memory pool is answered, not dereferenced
        if: runner.os == 'Linux'
        run: python -I -B tests/test_nvn_null_pool.py
      - name: Check a null NVN texture builder is a scratch one
        if: runner.os == 'Linux'
        run: python -I -B tests/test_nvn_tex_builder_guard.py
      - name: Check controller rumble keeps going
        if: runner.os == 'Linux'
        run: python -I -B tests/test_rumble_refresh.py
      - name: Check a repeated draw keeps its dynamic state
        if: runner.os == 'Linux'
        run: python -I -B tests/test_same_dyn.py
      - name: Check upscale menu labels
        if: runner.os == 'Linux'
        run: python -I -B tests/test_upscale_label.py
      - name: Check movie upscale fallback policy
        if: runner.os == 'Linux'
        run: python -I -B tests/test_movie_upscale_policy.py
      - name: Check Alt+Enter is fullscreen, not Plus
        if: runner.os == 'Linux'
        run: python -I -B tests/test_alt_enter.py
      - name: Check scripted input and physical focus routing
        if: runner.os == 'Linux'
        run: python -I -B tests/test_input_background.py --cc gcc
      - name: Check import windows
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_import_windows.py --cxx g++
      - name: Check a texture handle is looked up once
        run: python -I -B tests/test_handle_lookup.py
      - name: Check a repeated bind keeps its descriptors
        if: runner.os == 'Linux'
        run: python -I -B tests/test_same_bind.py
      - name: Check the game launcher
        if: runner.os == 'Linux'
        run: python -I -B tests/test_hookshot_launch.py
      - name: Clang for the lowering check
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang
      - name: Check every dependency barrier form lowers
        if: runner.os == 'Linux'
        run: python -I -B tests/test_lower_depbar.py --cxx clang++

  spirv-global16:
    name: SPIR-V global narrow load/store lowering
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 496543121ce6419f23d6fa5d7194ba66c36212d2
          path: _deps/spirv-headers
          persist-credentials: false
      - name: Install Clang C++20 and SPIR-V validator
        run: sudo apt-get update && sudo apt-get install -y clang spirv-tools
      - name: Configure the focused real-IR fixture
        run: >-
          CC=clang CXX=clang++ cmake -S tests/global_load_16 -B ${{ runner.temp }}/global-load-16
          -DREPO_ROOT=${{ github.workspace }}
          -DSPIRV_HEADERS_ROOT=${{ github.workspace }}/_deps/spirv-headers
      - name: Build the focused fixture
        run: cmake --build ${{ runner.temp }}/global-load-16 --parallel 2
      - name: Emit and inspect real IR modules
        run: ${{ runner.temp }}/global-load-16/global_load_16_ir ${{ runner.temp }}/global-load-16/modules
      - name: Validate every emitted module
        shell: bash
        run: |
          for module in "${{ runner.temp }}"/global-load-16/modules/*.spv; do
            spirv-val --target-env vulkan1.3 "$module"
          done
